name: Build audio.cpp for Android

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Configure CMake
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH="$ANDROID_NDK_HOME"
          fi

          cmake -S . -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wno-error=pedantic" \
            -DENGINE_ENABLE_CUDA=OFF \
            -DENGINE_ENABLE_HIP=OFF \
            -DENGINE_ENABLE_METAL=OFF \
            -DENGINE_ENABLE_VULKAN=OFF \
            -DENGINE_ENABLE_LLAMAFILE=OFF \
            -DENGINE_ENABLE_NATIVE_CPU=OFF \
            -DENGINE_ENABLE_OPENMP=OFF \
            -DAUDIOCPP_MODEL_SET=custom \
            -DAUDIOCPP_MODELS=meanvc2 \
            -DAUDIOCPP_BUILD_NATIVE_MODEL_MANAGER=OFF \
            -DENGINE_BUILD_TESTS=OFF \
            -DENGINE_BUILD_EXAMPLES=OFF \
            -DENGINE_BUILD_WARMBENCH=OFF

      - name: Build audiocpp_cli
        run: |
          cmake --build build-android --target audiocpp_cli --verbose

      - name: Verify and inspect binary
        run: |
          ls -lh build-android/bin/audiocpp_cli
          file build-android/bin/audiocpp_cli

      - name: Upload binary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: audiocpp_cli_android_arm64
          path: build-android/bin/audiocpp_cli
